name: Something isn't working
description: Report a problem with the app
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the Setup & updates page (e.g. 1.0.0 (app)).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        Activity page -> tick "Show technical details" -> Copy log, and/or the end of app.log
        (Setup & updates -> Open settings & logs folder). Remove anything private before posting.
      render: text
  - type: input
    id: link
    attributes:
      label: Public SoundCloud link that shows the problem (optional)
